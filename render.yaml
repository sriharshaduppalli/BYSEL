services:
  - type: web
    name: bysel-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --limit-concurrency 16 --timeout-keep-alive 5 --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Durable user/auth storage — set Internal URL from bysel-db in Dashboard
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: QUOTE_BATCH_SIZE
        value: "25"
      - key: QUOTE_CACHE_MAX_ENTRIES
        value: "2500"
      - key: HEATMAP_CACHE_TTL_OPEN
        value: "5"
      - key: HEATMAP_QUOTE_MAX_AGE_OPEN
        value: "90"
      # Long-tail universe only. Curated leaders (~130 names) always fetch first.
      - key: HEATMAP_QUOTE_REFRESH_BUDGET
        value: "60"
      - key: MARKET_NEWS_BUDGET_SECONDS
        value: "4"
      - key: NEWS_CACHE_MAX_SYMBOLS
        value: "80"
      # Password reset email (prefer Resend — set the secret in Render Dashboard)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "BYSEL <onboarding@resend.dev>"
      - key: BYSEL_SUPPORT_EMAIL
        value: "bysel.trader@gmail.com"
      # Optional SMTP fallback (leave unset when using Resend only)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      # Never enable debug reset codes in production
      - key: AUTH_PASSWORD_RESET_DEBUG_RESPONSE
        value: "false"
    # Free plan sleeps after ~15 min idle. Keepalive: hit GET /warmup every
    # 10 min (UptimeRobot/cron) or upgrade this service off free. /health stays
    # fast and only kicks a throttled background warm.
    plan: free
    healthCheckPath: /health
